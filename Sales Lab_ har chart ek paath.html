<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Lab: har chart ek paath</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#101C2E;--panel:#182A44;--ink:#F1ECE2;--mute:#9DB1C7;--a1:#E3A23F;--a2:#6FCDBE;--a3:#EF8B7B;--a4:#B7A2F0;--line:#2A4468;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF2F7;--panel:#FFFFFF;--ink:#14263F;--mute:#4D6480;--a1:#B06A0A;--a2:#12806E;--a3:#C0392B;--a4:#6446C4;--line:#CAD6E4}}
:root[data-theme="dark"]{--bg:#101C2E;--panel:#182A44;--ink:#F1ECE2}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",Georgia,sans-serif;letter-spacing:-.02em}
.wrap{display:flex;min-height:100vh}
nav{width:230px;flex:none;padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
nav b{font:800 22px "Bricolage Grotesque",sans-serif;display:block;margin:0 8px 14px}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--mute);text-decoration:none;font-size:15px;border-left:3px solid transparent}
nav a:hover{color:var(--ink)}nav a.on{color:var(--ink);background:var(--panel);border-left-color:var(--a1)}
main{flex:1;min-width:0;max-width:900px;padding:30px 22px 70px;margin:0 auto}
h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:0 0 8px;font-weight:800}
.q{color:var(--a1);font-size:18px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
.card h3{margin:0 0 10px;font-size:17px}
.cv{position:relative;height:320px}
dl{margin:22px 0 0;display:grid;grid-template-columns:1fr;gap:14px}
dt{font:800 15px "Bricolage Grotesque",sans-serif;color:var(--a1);margin-bottom:2px}
dd{margin:0;max-width:70ch}
.warn dt{color:var(--a3)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kp div{border-left:4px solid var(--c);padding:2px 0 2px 12px}
.kp small{display:block;color:var(--mute);font-size:13px}.kp .big{font-size:28px;font-weight:800}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}th{color:var(--mute);font-weight:500}
.go{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.go a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);text-decoration:none}
.go a:hover{border-color:var(--a1)}.go small{color:var(--mute);display:block}
.pn{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.pn a{color:var(--a1);text-decoration:none;font-weight:500}
:focus-visible{outline:3px solid var(--a1);outline-offset:2px}
@media(max-width:760px){.wrap{display:block}nav{width:auto;height:auto;position:static;border:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:10px}nav b{display:none}nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav a.on{border-bottom-color:var(--a1)}.cv{height:280px}}
</style>
</head>

const cr=v=>v>=1e7?(v/1e7).toFixed(2)+' cr':v>=1e5?(v/1e5).toFixed(1)+' L':Math.round(v).toLocaleString('en-IN');
const rs=v=>'₹'+cr(v);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let live=[];
function base(){Chart.defaults.color=css('--mute');Chart.defaults.borderColor=css('--line');Chart.defaults.font.family='"IBM Plex Sans",sans-serif';Chart.defaults.maintainAspectRatio=false}
const col=()=>[css('--a1'),css('--a2'),css('--a3'),css('--a4')];
const yfmt={ticks:{callback:v=>cr(v)}};
const bar=(l,d,c,o={})=>({type:'bar',data:{labels:l,datasets:[{data:d,backgroundColor:c,borderRadius:4}]},options:{plugins:{legend:{display:false}},...o}});
const P=[
{id:'home',t:'Overview',s:'Poori kahani ek nazar mein'},
{id:'trend',t:'1. Monthly Trend',s:'Sales target se kitni door?',
 q:'Har mahine ki sales target ke muqable kaisi rahi?',
 ch:()=>[{h:'Monthly net sales vs target (₹)',c:{type:'line',data:{labels:D.trend.m,datasets:[{label:'Net sales',data:D.trend.sales,borderColor:col()[0],backgroundColor:col()[0]+'33',fill:true,tension:.25,pointRadius:3},{label:'Target',data:D.trend.target,borderColor:col()[1],borderDash:[6,5],pointRadius:0}]},options:{scales:{y:yfmt}}}}],
 read:'Peeli line asli sales hai, hari dotted line target. Dono ke beech ka faasla hi “shortfall” hai. Line ka upar-neeche hona volatility batata hai.',

 why:'Laptop aur phone jaise bade-ticket orders (₹65,000 tak) kuch hi aate hain. Isliye ek mahine mein 5 bade orders kam hue to poori line gir jaati hai. Ye “lumpy demand” hai.',

{id:'cat',t:'2. Products',s:'Paisa kahan se aata hai',

{id:'region',t:'3. Regions',s:'Target ke muqable region',

function show(){
 const id=(location.hash||'#home').slice(1),i=Math.max(0,P.findIndex(p=>p.id==id)),p=P[i];
 live.forEach(c=>c.destroy());live=[];base();
 document.getElementById('nav').innerHTML='<b>Sales Lab</b>'+P.map(x=>`<a href="#${x.id}" class="${x.id==p.id?'on':''}">${x.t}</a>`).join('');
 const m=document.getElementById('main');let h='';
 if(i==0){
  const k=[['Gross sales',rs(D.gross),'--a1'],['Net sales (Completed + Pending)',rs(D.net),'--a2'],['Cancel + Return mein gaya',rs(D.lost),'--a3'],['Reported margin',D.margin.toFixed(1)+'%','--a1'],['Sachcha margin (fixed cost)',(D.truep/D.net*100).toFixed(1)+'%','--a4'],['Average rating',D.rating.toFixed(2)+' / 5','--a2']];
  h=`<h1>Electronics Sales: har chart ek paath</h1><p class="q">1,000 orders, 16 products, 4 regions, Jan 2025 se Sep 2026.</p>
  <div class="card"><div class="kp">${k.map(x=>`<div style="--c:var(${x[2]})"><small>${x[0]}</small><span class="big">${x[1]}</span></div>`).join('')}</div></div>
  <div class="card"><h3>Pehle data ki safai (professor ka rule: analysis se pehle cleaning)</h3><table><tr><th>Samasya</th><th>Kya kiya</th></tr>
  <tr><td>2 poore duplicate orders (O00101, O00251)</td><td>Hata diye, 1,002 rows se 1,000 orders bache</td></tr>
  <tr><td>101 orders mein Rating missing</td><td>Average sirf bhari hui ratings par nikala</td></tr>
  <tr><td>1 jagah Customer_Name khali</td><td>Customer_ID se pehchaan hui, analysis par asar nahi</td></tr>
  <tr><td>Cost discount ke saath ghatti dikhti hai</td><td>Sachcha margin Product_Master ki fixed cost se alag nikala</td></tr></table></div>
  <h3>8 chart pages, har ek ek sawaal ka jawab</h3><div class="go">${P.slice(1).map(x=>`<a href="#${x.id}"><b>${x.t}</b><small>${x.s}</small></a>`).join('')}</div>`;
 }else{
  h=`<h1>${p.t.replace(/^\d+\.\s/,'')}</h1><p class="q">Sawaal: ${p.q}</p>`+p.ch().map((c,j)=>`<div class="card"><h3>${c.h}</h3><div class="cv"><canvas id="c${j}" role="img" aria-label="${c.h}"></canvas></div></div>`).join('')+
  `<dl><div><dt>Chart ko kaise padhein</dt><dd>${p.read}</dd></div><div><dt>Kya mila</dt><dd>${p.find}</dd></div><div><dt>Sambhav kaaran (hypothesis)</dt><dd>${p.why}</dd></div><div><dt>Ab kya karein</dt><dd>${p.act}</dd></div><div class="warn"><dt>Savdhaani</dt><dd>${p.warn}</dd></div></dl>`+
  `<div class="pn"><a href="#${P[i-1].id}">← ${P[i-1].t}</a>${P[i+1]?`<a href="#${P[i+1].id}">${P[i+1].t} →</a>`:'<span></span>'}</div>`;
 }
 m.innerHTML=h;scrollTo(0,0);
 if(i>0)p.ch().forEach((c,j)=>live.push(new Chart(document.getElementById('c'+j),c.c)));
}
addEventListener('hashchange',show);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',show);
show();
</script>
</body>
</html>
